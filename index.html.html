const isQ=c[1]==='q';const lbl=document.createElement('div');lbl.className='hint';lbl.textContent=isQ?'Frage von '+S.pn+' – deine Antwort geht an '+S.pn:(c[1]==='b'?'Aufgabe zusammen':c[1]==='m'?'Aufgabe für Marco':'Aufgabe für Kirsten');const body=document.createElement('div');body.textContent=isQ?c[2]:fill(c[2]);$('#ctxt').replaceChildren(lbl,body);$('#qans').value='';['#qans','#qsend'].forEach(x=>$(x).classList.toggle('hide',!isQ));['#send'].forEach(x=>$(x).classList.toggle('hide',isQ))}

const MOODS=[['😴 Müde',1],['😏 Verspielt',2],['🔥 Neugierig',3],['😈 Lust auf mehr',4],['🎲 Egal',0]];
function moods(){const el=$('#mood');el.textContent='';MOODS.forEach(([n,l])=>{const b=document.createElement('button');b.textContent=n;b.className=l===lvl?'on':'';b.onclick=()=>{lvl=l;moods();draw()};el.appendChild(b)})}
function wishes(){if(!S.wishes){S.wishes=['Ein Frühstück im Bett','Ein Abend, an dem du alles bestimmst','Eine Massage mit Öl','Ein Wochenende ohne Handy','Ein Date, das ich nicht planen muss'];save()}return S.wishes}
function renderWishes(){const ul=$('#wlist');ul.textContent='';wishes().forEach((w,i)=>{const li=document.createElement('li');li.style.margin='6px 0';li.textContent=w+' ';const x=document.createElement('button');x.textContent='✕';x.onclick=()=>{wishes().splice(i,1);save();renderWishes()};li.appendChild(x);ul.appendChild(li)})}
$('#wbtn').onclick=()=>{$('#t-card').classList.add('hide');$('#t-wish').classList.remove('hide');renderWishes()};
$('#wback').onclick=()=>{$('#t-wish').classList.add('hide');$('#t-card').classList.remove('hide')};
$('#wadd').onclick=()=>{const v=$('#wnew').value.trim();if(!v)return;wishes().push(v);save();$('#wnew').value='';renderWishes()};
$('#wsend').onclick=()=>{if(!wishes().length){alert('Noch keine Wünsche eingetragen.');return}waOpen(S.me+' wünscht sich:\n\n'+wishes().map(w=>'• '+w).join('\n'))};

function start(){lvl=1;S={...S,pn:S.me==='Marco'?'Kirsten':'Marco'};save();$('#setup').classList.add('hide');$('#daily').classList.remove('hide');moods();draw();show('card')}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{role=b.dataset.r;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b))});
$('#pickM').onclick=()=>{S={...S,me:'Marco',pn:'Kirsten',role:'m'};save();start()};
$('#pickK').onclick=()=>{S={...S,me:'Kirsten',pn:'Marco',role:'w'};save();start()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
$('#nudge').onclick=()=>waOpen('Du bist dran 😘 Mach mal was 😘');
$('#next').onclick=()=>{if(lvl>=1&&lvl<4)lvl++;moods();draw()};
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const NUM={k:'4916093358588',m:'491714133055'};
function waOpen(text0){const text='📱 Aus unserer App „Kirsten & Marco“:\n\n'+text0;const p=(S.pn||'').trim().toLowerCase();const num=p.startsWith('k')?NUM.k:p.startsWith('m')?NUM.m:'';const a=document.createElement('a');a.href='https://wa.me/'+num+'?text='+encodeURIComponent(text);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
$('#send').onclick=()=>waOpen(S.me+' hatte die Aufgabe:\n\n'+fill(D[cur][2])+'\n\nHier das Ergebnis 👇');
$('#qsend').onclick=()=>{const a=$('#qans').value.trim();if(!a)return;waOpen(S.me+' hatte die Frage:\n\n'+fill(D[cur][2])+'\n\nMeine Antwort: '+a)};
$('#reset').onclick=()=>{S.role='';save();location.reload()};
if(S.role&&S.me&&S.pn){start()}else{$('#setup').classList.remove('hide')}
</script></body></html>
